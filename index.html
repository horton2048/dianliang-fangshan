<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23b13e53%22/%3E%3Crect x=%224%22 y=%224%22 width=%228%22 height=%228%22 fill=%22%23ffcd75%22/%3E%3C/svg%3E">
<title>点亮房山 · 北工大房山新校区新生探索</title>
<style>
  html,body{margin:0;height:100%;background:#1a1c2c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #touch{display:none}
  .coarse #touch{display:block}
  #joy{position:fixed;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(244,244,244,.12);border:3px solid rgba(244,244,244,.35)}
  #knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(244,244,244,.45)}
  .btn{position:fixed;width:58px;height:58px;border-radius:50%;background:rgba(177,62,83,.75);color:#f4f4f4;font:bold 22px sans-serif;display:flex;align-items:center;justify-content:center;border:3px solid #1a1c2c}
  #bA{right:22px;bottom:64px}#bB{right:92px;bottom:24px;background:rgba(59,93,201,.75)}
  .sbtn{position:fixed;bottom:8px;height:30px;padding:0 10px;border-radius:6px;background:rgba(26,28,44,.7);color:#f4f4f4;font:bold 14px sans-serif;display:flex;align-items:center;border:2px solid #94b0c2}
  #bM{left:calc(50% - 118px)}#bI{left:calc(50% - 62px)}#bE{left:calc(50% - 6px)}#bN{left:calc(50% + 50px)}
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="960" height="540"></canvas></div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div class="btn" id="bA">A</div><div class="btn" id="bB">B</div>
  <div class="sbtn" id="bM">地图</div><div class="sbtn" id="bI">背包</div><div class="sbtn" id="bE">菜单</div><div class="sbtn" id="bN">声音</div>
</div>
<script src="mapdata.js"></script>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="touch.js"></script>
</body>
</html>
